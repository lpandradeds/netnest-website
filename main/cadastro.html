<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="../style/forms.css">
</head>
<body>
    <div class="container">
        <p class="title">Crie uma conta</p>
        <form class="login-form">
            <input class="in" size="40" type="text" placeholder="Nome de usuário" required>
            <input class="in" size="40" type="password" placeholder="Senha" required>
            <input class="in" size="40" type="email" placeholder="E-mail" required>
            <input class="in" type="submit" value="Cadastrar">
        </form>
    </div>
</body>
</html>
