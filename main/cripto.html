<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criptografia Isolada</title>
  <link rel="stylesheet" href="../style/service.css">
</head>
<body>
  <main class="service-container">
    <h1 class="service-title">Criptografia Isolada</h1>

    <div class="service-content">
      <section class="service-media" aria-label="Imagem do serviço">
        <div class="service-image-placeholder">
          <img src="../assets/images/cripto.png" alt="Imagem do serviço de criptografia">
        </div>
      </section>

      <div class="service-divider" aria-hidden="true"></div>

      <section class="service-description">
        <p>
          Proteja dados internos e externos com transferência isolada,
          criptografia dedicada e controle de acesso configurável.
        </p>
        <p class="service-price">R$ 49,90 / mês</p>
        <button type="button" class="purchase-button" data-purchase>
          Iniciar compra
        </button>
      </section>
    </div>
  </main>

  <script src="../script/service.js" defer></script>
</body>
</html>
